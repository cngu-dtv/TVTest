name: Build

on:
  push:
    branches:
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - develop
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86
            platform: Win32
          - arch: x64
            platform: x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: microsoft/setup-msbuild@v2

      - name: Build LibISDB
        run: msbuild src/LibISDB/Projects/LibISDB.sln -p:Configuration=Release -p:Platform=${{ matrix.platform }} -m -v:m

      - name: Build TVTest
        run: msbuild src/TVTest.sln -t:TVTest -p:Configuration=Release -p:Platform=${{ matrix.platform }} -m -v:m

      - name: Build Help
        continue-on-error: true
        run: |
          choco install html-help-workshop --no-progress -y
          msbuild src/TVTest.sln -t:Help -p:Configuration=Release -p:Platform=${{ matrix.platform }} -m -v:m

      - name: Build plugins
        run: msbuild sdk/Samples/Samples.sln -p:Configuration=Release_static -p:Platform=${{ matrix.platform }} -m -v:m

      - name: Package
        shell: bash
        run: |
          bash package.sh -a ${{ matrix.arch }} -c static -l useful -r 7z
          ls -l package/*.7z

      - uses: actions/upload-artifact@v4
        with:
          name: TVTest-${{ matrix.arch }}
          path: package/*.7z
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.7z
          generate_release_notes: true
